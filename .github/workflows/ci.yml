name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --cov=app --cov-branch --cov-fail-under=95

      - run: python scripts/smoke.py
      - run: git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/manifest.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-python-${{ matrix.python }}
          path: ${{ runner.temp }}/manifest.sha256
